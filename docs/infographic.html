<!doctype html>
<html><head><meta charset="utf-8">
<!-- 렌더: chrome --headless --screenshot --window-size=1600,1290 "file://.../infographic.html?lang=ko|en" -->
<style>
:root{--ink:#12203a;--mut:#5b6678;--line:#d9dee7;--paper:#f7f8fa;--blue:#0067c0;--green:#1f8a4c;--amber:#b85c00;--card:#fff}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1290px;background:var(--paper);color:var(--ink);padding:44px 52px;
 font-family:'Pretendard','Apple SD Gothic Neo','Segoe UI',-apple-system,sans-serif;word-break:keep-all}
.kick{font-size:17px;font-weight:700;color:var(--blue);letter-spacing:.06em}
h1{font-size:44px;font-weight:800;margin:6px 0 4px}
.sub{font-size:20px;color:var(--mut)}
.row{display:flex;gap:22px;margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.h{font-size:15px;font-weight:800;color:var(--mut);letter-spacing:.08em;margin-bottom:14px}
.flow{display:flex;align-items:center;gap:14px}
.node{flex:1;border:2px solid var(--ink);border-radius:12px;padding:14px 16px;min-height:112px}
.node b{display:block;font-size:20px;margin-bottom:6px}
.node span{font-size:15px;color:var(--mut);line-height:1.45}
.node.sb{border-color:var(--blue);background:#eef5fc}
.arr{text-align:center;font-size:14px;color:var(--mut);width:150px;line-height:1.35}
.arr i{display:block;font-style:normal;font-size:28px;color:var(--ink)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.t{font:600 15px ui-monospace,Menlo,monospace;background:#f0f2f6;border-radius:8px;padding:8px 10px}
.t small{display:block;font:400 13px 'Apple SD Gothic Neo','Segoe UI',sans-serif;color:var(--mut);margin-top:3px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.n b{display:block;font-size:34px;font-weight:800;color:var(--green)}
.n span{font-size:14px;color:var(--mut);line-height:1.35}
.uc{font-size:16px;line-height:1.5;margin-bottom:12px}
.uc b{color:var(--blue)}
.code{font:13px ui-monospace,Menlo,monospace;color:var(--mut);background:#f0f2f6;border-radius:8px;padding:8px 10px;margin-top:6px}
.foot{margin-top:18px;font-size:14px;color:var(--mut)}
.pill{display:inline-block;border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;margin-right:8px;white-space:nowrap}
.ut{width:100%;border-collapse:collapse;font-size:16px}
.ut td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.4}
.ut tr:first-child td{border-top:0}
.ut td:first-child{font-weight:700;width:44%}
.ut td:nth-child(2){color:var(--mut)}
.ut td:last-child{width:18%;white-space:nowrap;font-weight:700}
.ok{color:var(--green)}.warn{color:var(--amber)}
.nf{margin-top:10px;font-size:15px;color:var(--mut)}.nf b{color:var(--ink)}
</style></head><body>
<div class="kick" data-k="kick"></div>
<h1 data-k="title"></h1>
<div class="sub" data-k="sub"></div>

<div class="card" style="margin-top:24px">
 <div class="h" data-k="h_arch"></div>
 <div class="flow">
  <div class="node"><b data-k="n1b"></b><span data-k="n1s"></span></div>
  <div class="arr"><i>→</i><span data-k="a1"></span></div>
  <div class="node"><b data-k="n2b"></b><span data-k="n2s"></span></div>
  <div class="arr"><i>→</i><span data-k="a2"></span></div>
  <div class="node sb"><b data-k="n3b"></b><span data-k="n3s"></span></div>
 </div>
</div>

<div class="card" style="margin-top:22px">
 <div class="h" data-k="h_use"></div>
 <table class="ut" id="use"></table>
 <div class="nf" data-k="nf"></div>
</div>

<div class="row">
 <div class="card" style="flex:1.25">
  <div class="h" data-k="h_tools"></div>
  <div class="tools" id="tools"></div>
 </div>
 <div class="card" style="flex:1">
  <div class="h" data-k="h_uc"></div>
  <div class="uc" data-k="uc1"></div><div class="code">box_snapshot → install → box_snapshot → box_diff</div>
  <div class="uc" style="margin-top:14px" data-k="uc2"></div><div class="code">box_start network=off → run sample → box_diff</div>
 </div>
</div>

<div class="row">
 <div class="card" style="flex:1">
  <div class="h" data-k="h_nums"></div>
  <div class="nums" id="nums"></div>
 </div>
</div>
<div class="foot"><span class="pill" data-k="p1"></span><span class="pill" data-k="p2"></span><span class="pill" data-k="p3"></span><span data-k="foot"></span></div>

h_use:"언제 유용한가",

["설치기가 어디에 뭘 깔고, 지운 뒤 뭐가 남는지","설치 전후·제거 후 box_snapshot → box_diff","✅ 실측 (3종 탐지)",1],
["출처가 애매한 exe·외부 도구를 내 PC에 깔기 전에 맛보기","network=off 샌드박스에서 실행 → 연결 시도·DNS·자동실행","✅ 바로 사용",1],

["box_snapshot","파일·레지스트리·서비스…"],["box_diff","전후 비교"],["box_stop","폐기"]],

en:{kick:"WINBOX-MCP · v0.2.2",title:"A disposable Windows Sandbox MCP, one SSH line away",

["Try a dubious exe or tool before installing it on your own PC","Run in a network=off sandbox → connections, DNS, autoruns","✅ Ready",1],
["Windows-only checks for an AI agent on Mac/Linux","box_exec over one SSH line → output and screenshots","✅ Ready",1],
["Does an Excel add-in actually load inside Excel?","Install Office offline each time, then check","⚠️ Not measured",0]],

nums:[["11–13 s","boot (very first boot 72 s)"],["≈1.5 s","box_exec round trip (was 20 s)"],["13 s","box_reset (was 30 s)"],
["0","network adapters with network=off"],["≈17 s","empty-sandbox snapshot (≈3 MB)"],["3/3","planted add-in, autoload, task detected"]],
tools:[["box_start","clean boot"],["box_status","state & owner"],["box_reset","discard, fresh one"],["box_trial","one repeat trial"],
["box_exec","run PowerShell"],["box_copy_in","copy files in"],["box_copy_out","copy files out"],["box_screenshot","screen PNG"],

document.documentElement.lang=L===T.en?"en":"ko";
document.querySelectorAll("[data-k]").forEach(e=>e.innerHTML=L[e.dataset.k]);
tools.innerHTML=L.tools.map(([a,b])=>`<div class="t">${a}<small>${b}</small></div>`).join("");
use.innerHTML=L.use.map(([a,b,c,o])=>`<tr><td>${a}</td><td>${b}</td><td class="${o?"ok":"warn"}">${c}</td></tr>`).join("");
nums.innerHTML=L.nums.map(([a,b])=>`<div class="n"><b>${a}</b><span>${b}</span></div>`).join("");
</script></body></html>
